name: Supabase Keepalive (Development)

on:
  schedule:
    # Run every 5 days at 2:30 AM UTC (30 minutes after prod, runs on days 1, 6, 11, 16, 21, 26, 31 of each month)
    - cron: '30 2 */5 * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  keepalive-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        
      - name: Supabase Keepalive - Development
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          echo "=== Supabase Keepalive Started ==="
          echo "Date: $(date)"
          echo "Environment: Development"
          echo "Supabase URL: $SUPABASE_URL"
          
          # Create keepalive script
          cat > keepalive-dev.cjs << 'EOF'
          const https = require('https');
          const http = require('http');
          
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_ANON_KEY;
          
          console.log(`[${new Date().toISOString()}] Starting Supabase Keepalive - Development`);
          console.log(`[${new Date().toISOString()}] Target: ${SUPABASE_URL}`);
          
          async function makeRequest(url, options = {}) {
            return new Promise((resolve, reject) => {
              const urlObj = new URL(url);
              const requestOptions = {
                hostname: urlObj.hostname,
                port: urlObj.port || (urlObj.protocol === 'https:' ? 443 : 80),
                path: urlObj.pathname + urlObj.search,
                method: options.method || 'GET',
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Content-Type': 'application/json',
                  ...options.headers
                }
              };
              
              const client = urlObj.protocol === 'https:' ? https : http;
              const req = client.request(requestOptions, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  resolve({ status: res.statusCode, data });
                });
              });
              
              req.on('error', reject);
              if (options.body) req.write(options.body);
              req.end();
            });
          }
          
          async function runKeepalive() {
            try {
              console.log(`[${new Date().toISOString()}] [TEST 1] Health check...`);
              const healthResponse = await makeRequest(`${SUPABASE_URL}/rest/v1/`);
              console.log(`[${new Date().toISOString()}] [OK] Health check: ${healthResponse.status}`);
              
              console.log(`[${new Date().toISOString()}] [TEST 2] Services table...`);
              const servicesResponse = await makeRequest(`${SUPABASE_URL}/rest/v1/services?select=id&limit=1`);
              console.log(`[${new Date().toISOString()}] [OK] Services query: ${servicesResponse.status}`);
              
              console.log(`[${new Date().toISOString()}] [TEST 3] Sessions table...`);
              const sessionsResponse = await makeRequest(`${SUPABASE_URL}/rest/v1/sessions?select=session_id&limit=1`);
              console.log(`[${new Date().toISOString()}] [OK] Sessions query: ${sessionsResponse.status}`);
              
              console.log(`[${new Date().toISOString()}] [TEST 4] Training registrations...`);
              const registrationsResponse = await makeRequest(`${SUPABASE_URL}/rest/v1/training_registrations?select=registration_id&limit=1`);
              console.log(`[${new Date().toISOString()}] [OK] Registrations query: ${registrationsResponse.status}`);
              
              console.log(`[${new Date().toISOString()}] [TEST 5] Session cancellations...`);
              const cancellationsResponse = await makeRequest(`${SUPABASE_URL}/rest/v1/session_cancellations?select=id&limit=1`);
              console.log(`[${new Date().toISOString()}] [OK] Cancellations query: ${cancellationsResponse.status}`);
              
              console.log(`[${new Date().toISOString()}] [TEST 6] Pricing rules...`);
              const pricingResponse = await makeRequest(`${SUPABASE_URL}/rest/v1/pricing_rules?select=id&limit=1`);
              console.log(`[${new Date().toISOString()}] [OK] Pricing rules query: ${pricingResponse.status}`);
              
              console.log(`[${new Date().toISOString()}] [TEST 7] Edge Functions...`);
              const edgeResponse = await makeRequest(`${SUPABASE_URL}/functions/v1/check-registration-status`, {
                method: 'POST',
                body: JSON.stringify({ sessionId: 'keepalive-test' })
              });
              console.log(`[${new Date().toISOString()}] [OK] Edge function test: ${edgeResponse.status}`);
              
              console.log(`[${new Date().toISOString()}] [SUCCESS] KEEPALIVE COMPLETE - Development project is active`);
              console.log(`[${new Date().toISOString()}] [SUCCESS] All database operations completed successfully`);
              
            } catch (error) {
              console.error(`[${new Date().toISOString()}] [ERROR] Keepalive failed:`, error.message);
              process.exit(1);
            }
          }
          
          runKeepalive()
            .then(() => {
              console.log(`[${new Date().toISOString()}] [SUCCESS] Development keepalive completed successfully`);
              process.exit(0);
            })
            .catch(error => {
              console.error(`[${new Date().toISOString()}] [FATAL] Fatal error:`, error);
              process.exit(1);
            });
          EOF
          
          # Run the keepalive script
          node keepalive-dev.cjs
        
      - name: Send Success Notification (Dev)
        if: success()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          echo "=== Sending Success Notification via Resend (Dev) ==="
          
          # Create email payload for Resend
          cat > email-success-dev.json << EOF
          {
            "from": "AI Focus <noreply@mail.ai-focus.org>",
            "to": ["$NOTIFICATION_EMAIL"],
            "subject": "✅ Supabase Keepalive SUCCESS (DEV) - $(date -u '+%Y-%m-%d %H:%M:%S UTC')",
            "html": "<h2>Supabase Keepalive Success - Development</h2><p><strong>Status:</strong> ✅ SUCCESS</p><p><strong>Environment:</strong> DEVELOPMENT</p><p><strong>Time:</strong> $(date -u '+%Y-%m-%d %H:%M:%S UTC')</p><p><strong>Project:</strong> ai-focus-app-dev</p><p><strong>Supabase URL:</strong> https://vcxfwxrnrskvsgqxqrsz.supabase.co</p><p><strong>Message:</strong> Development keepalive completed successfully - Project is active and healthy</p><h3>What this means:</h3><ul><li>✅ Your DEVELOPMENT Supabase project is active</li><li>✅ Database operations completed successfully</li><li>✅ No action required</li><li>✅ Development project protected from deactivation</li></ul><p><em>This is an automated notification from your Supabase Keepalive system (Development).</em></p>"
          }
          EOF
          
          # Send email via Resend API
          curl -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @email-success-dev.json
          
          echo "Success notification sent via Resend (Dev)"
        
      - name: Send Failure Notification (Dev)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          echo "=== Sending Failure Notification via Resend (Dev) ==="
          
          # Create email payload for Resend
          cat > email-failure-dev.json << EOF
          {
            "from": "AI Focus <noreply@mail.ai-focus.org>",
            "to": ["$NOTIFICATION_EMAIL"],
            "subject": "❌ Supabase Keepalive FAILURE (DEV) - $(date -u '+%Y-%m-%d %H:%M:%S UTC')",
            "html": "<h2>Supabase Keepalive Failure - Development</h2><p><strong>Status:</strong> ❌ FAILURE</p><p><strong>Environment:</strong> DEVELOPMENT</p><p><strong>Time:</strong> $(date -u '+%Y-%m-%d %H:%M:%S UTC')</p><p><strong>Project:</strong> ai-focus-app-dev</p><p><strong>Supabase URL:</strong> https://vcxfwxrnrskvsgqxqrsz.supabase.co</p><p><strong>Message:</strong> Development keepalive failed - manual intervention may be required</p><h3>Immediate Actions Required:</h3><ul><li>❌ Check Supabase dashboard for development project status</li><li>❌ Verify development API keys and connectivity</li><li>❌ Review GitHub Actions logs for error details</li><li>❌ Consider manual intervention</li></ul><h3>Troubleshooting Steps:</h3><ol><li>Go to GitHub Actions dashboard</li><li>Check the failed development workflow run</li><li>Review detailed logs</li><li>Verify Supabase development project is active</li><li>Test development API keys manually if needed</li></ol><p><em>This is an automated notification from your Supabase Keepalive system (Development).</em></p>"
          }
          EOF
          
          # Send email via Resend API
          curl -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @email-failure-dev.json
          
          echo "Failure notification sent via Resend (Dev)"
